<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>LUS-222 / Turntable de comparação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/" } }</script>
<style>
  :root { color-scheme: dark; --ink: #e8ecf1; --muted: #8b95a3; --line: #243042; --bg: #0b0f15; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 "DM Sans", system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100dvh; overflow: hidden; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 15px; font-weight: 600; }
  h1 span { color: var(--muted); font-weight: 400; }
  .ctl { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  button { font: inherit; color: var(--ink); background: #151c27; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button[aria-pressed="true"] { background: #e8ecf1; color: #0b0f15; border-color: #e8ecf1; }
  a { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr); min-height: 0; }
  .ref { position: relative; border-right: 1px solid var(--line); min-height: 0; background: #1b4a7d; }
  .ref img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .vistas { position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .grelha { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; pointer-events: none; }
  .grelha div { border: 0.5px solid var(--line); }
  .rotulo { position: absolute; left: 10px; top: 8px; font: 500 11px/1 "IBM Plex Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .erro { position: absolute; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 0.55fr) minmax(0, 1.45fr); }
    .ref { border-right: 0; border-bottom: 1px solid var(--line); }
    .ctl { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>LUS-222 <span>· malha procedural vs render</span></h1>
  <div class="ctl">
    <button type="button" id="rodar" aria-pressed="false">Rodar 3/4</button>
    <button type="button" id="silhueta" aria-pressed="false">Silhueta</button>
    <button type="button" id="leve" aria-pressed="false">Perfil leve</button>
    <a href="./" style="align-self:center">Voltar à missão</a>
  </div>
</header>
<main>
  <figure class="ref" style="margin:0">
    <picture><source srcset="./img/lus-222-hero.webp" type="image/webp"><img src="./img/lus-222-hero.png" alt="Render de referência do LUS-222 em voo"></picture>
    <figcaption class="rotulo">Render de referência</figcaption>
  </figure>
  <section class="vistas" aria-label="Quatro vistas da malha Three.js">
    <canvas id="tt"></canvas>
    <div class="grelha" aria-hidden="true">
      <div><span class="rotulo">Lado</span></div>
      <div style="position:relative"><span class="rotulo">Frente</span></div>
      <div style="position:relative"><span class="rotulo">3/4 · de baixo</span></div>
      <div style="position:relative"><span class="rotulo">Cima</span></div>
    </div>
    <p class="erro" id="erro">Este browser não tem WebGL; a turntable precisa dele.</p>
  </section>
</main>
<script type="module" src="./src/turntable.js"></script>
</body>
</html>
